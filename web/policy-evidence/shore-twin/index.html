<h1>岸电与储能逐时回放</h1><p>上海工程仿真 · 三种策略从同一个 UTC 周起点运行。设备几何为示意，功率和荷电状态取自已核验的 TwinLab 周回执。</p>
<section><form id="request"><label>周起点（UTC）<select id="date"><option value="2025-05-01">2025-05-01</option><option value="2025-08-01">2025-08-01</option><option value="2026-01-01" selected>2026-01-01</option><option value="2026-01-03">2026-01-03</option></select></label><button id="run" disabled>读取 168 小时回执</button></form><p class="note">冻结回执可在 TwinLab 已关闭时查看。需要重算其他日期时，可运行 <code>G:\AI\WindowsDeploy\portai.cmd start twin</code>，然后<a href="http://127.0.0.1:8000/static/shore-policy-scene.html">进入原生孪生场景</a>。</p><p role="status" id="message">请选择周起点并读取回执。</p></section>
<p id="bindStatus" aria-live="polite" role="status"></p>
<div id="results" hidden>
<p><button type="button" id="bindScene" hidden disabled></button></p>
<section><h2>逐时电网输入</h2><div class="bar"><label>策略<select id="method"><option value="selected">受训策略</option><option value="idle">待机对照</option><option value="best_fixed">固定优化</option></select></label></div>
<p><svg class="chart" id="chart" viewBox="0 0 700 150" role="img" aria-label="所选策略的逐时电网输入功率"><path id="line" fill="none" stroke="#16726a" stroke-width="2"></path><line id="cursor" y1="5" y2="145" stroke="#ad561d" stroke-width="2"></line></svg></p>
<label>窗口内小时 <input type="range" id="hour" min="0" max="167" value="0"></label><output id="time"></output><dl id="metrics"></dl></section>
<section><div class="bar"><h2>船岸设备场景</h2><button id="toggle" aria-expanded="false">打开三维场景</button><button id="top" hidden>切换俯视</button></div>
<p id="mode" class="note">按需加载三维设备。切换小时或策略时，电池舱同步显示模型荷电状态。</p><div id="stage" tabindex="0" aria-label="船岸设备示意场景" hidden></div><output id="picked"></output></section>
<section><h2>同周方案比较</h2><div class="scroll"><table><thead><tr><th>策略</th><th>账单（元）</th><th>碳排（kg）</th><th>峰值（kW）</th></tr></thead><tbody id="totals"></tbody></table></div><p class="note" id="source"></p></section>
