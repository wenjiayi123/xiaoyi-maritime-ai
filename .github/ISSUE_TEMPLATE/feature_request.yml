name: Feature request
description: Propose an auditable capability or integration.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and operator role
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data, evidence, license, and safety boundary
      description: For a dataset or maritime source, include its publisher, license, provenance, and intended jurisdiction.
    validations:
      required: true
