name: Bug report
description: Report a reproducible defect without private port data or credentials.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, private port data, internal hostnames, or exploitable security details. Use a private security advisory for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options: [local, staging, production]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: X-Request-ID (if available)

