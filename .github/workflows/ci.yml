name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Rebuild generated knowledge index
        run: python scripts/build_index.py
      - name: Validate source and release candidate
        run: |
          python -m compileall -q app scripts
          python -m ruff check app scripts tests
          python scripts/release_check.py
          python -m pip check
          node --check web/app.js
      - name: Run tests
        run: python -m pytest -q
      - name: Validate container build
        run: |
          docker compose config --quiet
          docker build --tag xiaoyi-ai:ci .
