name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-research.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.19.0
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Install locked CPU research dependency
        run: python -m pip install --require-hashes --requirement requirements-research.lock
      - name: Install locked frontend test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild generated knowledge index
        run: |
          python scripts/build_index.py
          python scripts/restore_research_evidence.py
      - name: Validate source and release candidate
        run: |
          python -m compileall -q app scripts
          python -m ruff check app scripts tests
          python scripts/release_check.py
          python scripts/verify_published_agent_rl.py
          python -m pip check
          node --check web/app.js
          node --check web/linked_agent.js
          node --check web/runtime_contract.js
          pnpm test
      - name: Run tests
        run: python -m pytest -q
      - name: Validate container build
        run: |
          docker compose config --quiet
          docker build --tag xiaoyi-ai:ci .
